<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bioniks ERP</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b2a5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bioniks ERP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
:root{--navy:#0b2a5b;--navy2:#143d85;--bg:#f2f5fa;--card:#fff;--tx:#14213d;--mut:#64708a;--ok:#1a8a4a;--warn:#c77700;--bad:#c0392b;--bd:#dde3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);background-color:#f2f5fa}
header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header small{opacity:.75;display:block;font-size:12px}
main{padding:14px;max-width:760px;margin:auto;padding-bottom:90px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:0 0 auto;min-width:76px;border:0;background:none;padding:12px 2px;font-size:12px;color:var(--mut);min-height:52px}
nav button.on{color:var(--navy);font-weight:700;border-top:3px solid var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.tile small{color:var(--mut);font-size:12px}.tile div{font-size:20px;font-weight:700;margin-top:4px;color:var(--navy)}
h2{font-size:16px;margin:4px 0 10px;color:var(--navy)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:#fff;color:var(--tx)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--navy2);color:#fff;font-size:16px;font-weight:600;margin-top:12px;min-height:48px}
.btn.alt{background:#fff;color:var(--navy2);border:1px solid var(--navy2)}
.alert{padding:12px;border-radius:10px;margin-bottom:10px;font-size:14px;background:#fff4e0;color:#7a4a00;border:1px solid #f0d49a}
.alert.ok{background:#e6f6ec;color:#14633a;border-color:#a9dcbd}.alert.bad{background:#fdeceb;color:#8e2a20;border-color:#f0b5af}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--bd);text-align:left}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0b2a5b,#1a4fa3);padding:20px}
.login .card{width:100%;max-width:380px;padding:24px}.login h1{margin:0;color:var(--navy);font-size:24px}.login p{color:var(--mut);margin:4px 0 14px}
.scroll{overflow-x:auto}@media print{header,nav,.noprint{display:none!important}main{padding:0}body{background:#fff}.card{border:0}}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORES=['settings','counters','audit','backups','customers','suppliers','products','machines','invoices','purchases','rentals','payments','expenses','services','vouchers','accounts','stock','units'];
const DOCS=[['sales_invoice','Sales invoice','INV'],['purchase_invoice','Purchase invoice','PUR'],['rental_agreement','Rental agreement','RA'],['rental_invoice','Rental invoice','RINV'],['payment_receipt','Payment receipt','RCT'],['payment_voucher','Payment voucher','PV'],['credit_note','Credit note','CN'],['debit_note','Debit note','DN'],['service_order','Service order','SRV'],['journal','Journal voucher','JV'],['contra','Contra voucher','CV'],['receipt_voucher','Receipt voucher','RV'],['grn','Goods receipt note','GRN'],['delivery_note','Delivery note','DLV'],['receipt_note','Machine receipt note','RN'],['warranty_dn','Delivery note to company','WDN']];
const APP_VERSION='1.4.0',DB_VERSION=3;
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('bioniks_erp',DB_VERSION);
r.onupgradeneeded=e=>{const d=r.result;STORES.forEach(n=>{if(!d.objectStoreNames.contains(n)){d.createObjectStore(n,n==='settings'||n==='counters'?{keyPath:'key'}:n==='audit'||n==='backups'?{keyPath:'id',autoIncrement:true}:{keyPath:'id'})}})};
r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const store=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const getOne=(n,k)=>req(store(n).get(k));
const putOne=(n,v)=>req(store(n,'readwrite').put(v));
const getAll=n=>req(store(n).getAll());
async function audit(action,detail){await putOne('audit',{at:new Date().toISOString(),action,detail})}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
let tab='dash',unlocked=false,idleT;

async function boot(){
 try{db=await openDB()}catch(e){$('#app').innerHTML='<div class="login"><div class="card"><h2>Storage unavailable</h2><p>This browser blocked offline storage (IndexedDB). Open the app in normal (non-private) Safari.</p></div></div>';return}
 for(const [k,,p] of DOCS){if(!await getOne('counters',k))await putOne('counters',{key:k,prefix:p+'-',next:1,padding:4})}
 if(!await getOne('settings','company'))await putOne('settings',{key:'company',name:'Bioniks Medical Equipments',address:'Vadakara, Kerala, India',gstin:'',phone:'',state:'Kerala',pinHash:null,fy:'04'});
 login()}

async function login(){
 const c=await getOne('settings','company');const setup=!c.pinHash;
 $('#app').innerHTML=`<div class="login"><div class="card"><h1>BIONIKS ERP</h1><p>${esc(c.name)}</p>
 ${setup?'<div class="alert">First use: create a PIN (4–8 digits). There is no PIN recovery, so keep a backup file.</div>':''}
 <label>${setup?'Create PIN':'Enter PIN'}</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
 ${setup?'<label>Confirm PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="8">':''}
 <div id="err" class="alert bad" style="display:none;margin-top:10px"></div>
 <button class="btn" id="go">${setup?'Create PIN & start':'Unlock'}</button></div></div>`;
 const err=m=>{$('#err').textContent=m;$('#err').style.display='block'};
 $('#go').onclick=async()=>{const p=$('#pin').value;
  if(!/^\d{4,8}$/.test(p))return err('PIN must be 4 to 8 digits.');
  if(setup){if(p!==$('#pin2').value)return err('PINs do not match.');c.pinHash=await sha('bioniks:'+p);await putOne('settings',c);await audit('PIN_CREATED','')}
  else if(await sha('bioniks:'+p)!==c.pinHash){await audit('LOGIN_FAILED','');return err('Wrong PIN.')}
  unlocked=true;await audit('LOGIN','');autoSnapshot();shell()}}

function resetIdle(){clearTimeout(idleT);if(unlocked)idleT=setTimeout(()=>{unlocked=false;login()},5*60*1000)}
['click','touchstart','keydown'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&unlocked){unlocked=false;login()}});

function shell(){resetIdle();
 $('#app').innerHTML=`<header><div><b>BIONIKS ERP</b><small id="cn"></small></div><button class="btn alt" style="width:auto;margin:0;padding:8px 12px;min-height:36px;font-size:14px" id="lock">Lock</button></header><main id="main"></main>
 <nav>${[['dash','Home'],['cust','Customers'],['prod','Products'],['sales','Sales'],['rent','Rentals'],['mach','Machines'],['acct','Accounts'],['exp','Expenses'],['svc','Service'],['rep','Reports'],['ser','Serials'],['stock','Stock'],['buy','Purchases'],['sup','Suppliers'],['company','Company'],['num','Numbers'],['bak','Backup']].map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('')}</nav>`;
 getOne('settings','company').then(c=>$('#cn').textContent=c.name);
 $('#lock').onclick=()=>{unlocked=false;login()};
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});render()}

async function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 const o=$('#main'),m=document.createElement('main');m.id='main';o.replaceWith(m);({dash,cust:customers,prod:products,sales:salesView,rent:rentalsView,mach:machinesView,acct:acctView,exp:expensesView,svc:servicesView,rep:reportsView,ser:serialView,stock:stockView,buy:purchases,sup:suppliers,company,num,bak:backupView})[tab](m)}

async function dash(m){
 const [inv,rent,mach,exp,cust,pur,sup]=await Promise.all(['invoices','rentals','machines','expenses','customers','purchases','suppliers'].map(getAll));
 const today=new Date().toISOString().slice(0,10),mon=today.slice(0,7);
 const live=inv.filter(i=>i.status!=='cancelled'&&i.type!=='credit'),sum=a=>a.reduce((s,x)=>s+(+x.total||0),0);
 const out=live.reduce((s,i)=>s+Math.max(0,(+i.total||0)-(+i.paid||0)-(+i.credited||0)),0);
 const supDue=pur.filter(p=>p.status!=='cancelled').reduce((s,p)=>s+Math.max(0,(+p.total||0)-(+p.paid||0)),0);
 const tiles=[['Today’s sales',money(sum(live.filter(i=>i.date===today)))],['Monthly sales',money(sum(live.filter(i=>(i.date||'').startsWith(mon))))],
 ['Customer outstanding',money(out)],['Supplier dues',money(supDue)],
 ['Active rentals',rent.filter(r=>r.status==='active').length],['Available machines',mach.filter(x=>x.status==='available').length],
 ['Monthly expenses',money(sum(exp.filter(e=>e.status!=='cancelled'&&(e.date||'').startsWith(mon))))],['Customers',cust.length],...(await stockSummary()).tiles,...(await rentSummary()),...(await acctSummary()),...(await svcSummary())];
 const xtra=await dashExtras();const last=(await getAll('backups')).filter(b=>b.kind==='export').pop();
 const due=!last||(Date.now()-new Date(last.at))>864e5;
 m.innerHTML=(due?'<div class="alert">⚠ Daily backup due. '+(last?'Last backup: '+new Date(last.at).toLocaleString():'No backup made yet.')+' Go to Backup.</div>':'<div class="alert ok">Backup is up to date.</div>')+
 `<div class="grid">${tiles.map(t=>`<div class="card tile"><small>${t[0]}</small><div>${t[1]}</div></div>`).join('')}</div>
 <div class="card"><h2>Last 6 months</h2>${xtra}<h2 style="margin-top:14px">Status</h2><p style="margin:0;color:var(--mut);font-size:14px">All figures are calculated from your stored records.</p></div>`}

async function company(m){
 const c=await getOne('settings','company');
 m.innerHTML=`<div class="card"><h2>Company settings</h2>
 ${[['name','Business name'],['address','Address'],['gstin','GSTIN (leave blank until you enter your real one)'],['phone','Phone'],['state','State']].map(([k,l])=>`<label>${l}</label><input id="f_${k}" value="${esc(c[k])}">`).join('')}
 <label>Financial year starts in</label><select id="f_fy">${['01','02','03','04','05','06','07','08','09','10','11','12'].map(x=>`<option value="${x}" ${c.fy===x?'selected':''}>${new Date(2000,+x-1,1).toLocaleString('en',{month:'long'})}</option>`).join('')}</select>
 <div id="msg"></div><button class="btn" id="save">Save</button></div>`;
 $('#save').onclick=async()=>{
  const g=$('#f_gstin').value.trim().toUpperCase();
  if(g&&!/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)){$('#msg').innerHTML='<div class="alert bad">GSTIN format looks invalid (15 characters).</div>';return}
  if(!$('#f_name').value.trim()){$('#msg').innerHTML='<div class="alert bad">Business name is required.</div>';return}
  Object.assign(c,{name:$('#f_name').value.trim(),address:$('#f_address').value.trim(),gstin:g,phone:$('#f_phone').value.trim(),state:$('#f_state').value.trim(),fy:$('#f_fy').value});
  await putOne('settings',c);await audit('SETTINGS_UPDATED','company');$('#cn').textContent=c.name;$('#msg').innerHTML='<div class="alert ok">Saved.</div>'}}

async function num(m){
 const cs=await getAll('counters');
 m.innerHTML=`<div class="card"><h2>Document numbering</h2><p style="font-size:13px;color:var(--mut);margin-top:0">Each document type has its own sequence. Numbers are never reused, and the next number can only be raised, never lowered.</p>
 ${DOCS.map(([k,l])=>{const c=cs.find(x=>x.key===k);return `<div style="border-top:1px solid var(--bd);padding-top:6px;margin-top:8px"><b>${l}</b> <small style="color:var(--mut)">next: ${c.prefix}${String(c.next).padStart(c.padding,'0')}</small>
 <div class="grid"><div><label>Prefix</label><input id="p_${k}" value="${esc(c.prefix)}" maxlength="10"></div><div><label>Next number</label><input id="n_${k}" type="number" min="${c.next}" value="${c.next}"></div></div></div>`}).join('')}
 <div id="msg"></div><button class="btn" id="save">Save numbering</button></div>`;
 $('#save').onclick=async()=>{
  for(const [k,l] of DOCS){const c=cs.find(x=>x.key===k),n=parseInt($('#n_'+k).value,10),p=$('#p_'+k).value.trim();
   if(!p||!/^[A-Za-z0-9\-\/]+$/.test(p)){$('#msg').innerHTML=`<div class="alert bad">${l}: prefix may use letters, digits, - and / only.</div>`;return}
   if(!(n>=c.next)){$('#msg').innerHTML=`<div class="alert bad">${l}: next number cannot be lower than ${c.next}.</div>`;return}
   if(p!==c.prefix||n!==c.next){c.prefix=p;c.next=n;await putOne('counters',c);await audit('NUMBERING_UPDATED',k+' '+p+n)}}
  num(m);setTimeout(()=>$('#msg').innerHTML='<div class="alert ok">Saved.</div>',50)}}

async function buildBackup(){
 const data={};for(const n of STORES){if(n==='backups')continue;data[n]=await getAll(n)}
 const s=data.settings.find(x=>x.key==='company');
 const body={app:'BIONIKS_ERP',appVersion:APP_VERSION,dbVersion:DB_VERSION,created:new Date().toISOString(),data};
 const checksum=await sha(JSON.stringify(body));return JSON.stringify({...body,checksum})}
async function verify(txt){
 const o=JSON.parse(txt);if(o.app!=='BIONIKS_ERP'||!o.data||!o.checksum)throw new Error('Not a Bioniks ERP backup.');
 const {checksum,...body}=o;if(await sha(JSON.stringify(body))!==checksum)throw new Error('Checksum mismatch: file is damaged or edited.');
 if(o.dbVersion>DB_VERSION)throw new Error('Backup is from a newer app version.');return o}

async function bak(m){
 const hist=(await getAll('backups')).reverse().slice(0,10);
 m.innerHTML=`<div class="card"><h2>Backup</h2>
 <p style="font-size:14px;margin-top:0">Tap Create backup, then save the file to <b>Files / iCloud Drive</b>. For a second copy, share the same file to <b>Google Drive</b> (use the Share sheet’s Drive option) or email it to yourself. A browser cannot save to several places automatically, so repeat the save for each location.</p>
 <button class="btn" id="mk">Create backup file</button><div id="msg"></div></div>
 <div class="card"><h2>Restore</h2><div class="alert bad">Restoring replaces all current data with the backup’s data.</div>
 <input type="file" id="fl" accept=".json,application/json"><div id="rmsg"></div></div>
 <div class="card"><h2>Backup history</h2><div class="scroll"><table><tr><th>When</th><th>Type</th><th>File</th></tr>${hist.map(b=>`<tr><td>${new Date(b.at).toLocaleString()}</td><td>${b.kind}</td><td>${esc(b.file||'')}</td></tr>`).join('')||'<tr><td colspan=3>No backups yet</td></tr>'}</table></div></div>`;
 $('#mk').onclick=async()=>{
  const txt=await buildBackup();await verify(txt);
  const name='bioniks-erp-backup-'+new Date().toISOString().replace(/[:T]/g,'-').slice(0,19)+'.json';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  await putOne('backups',{at:new Date().toISOString(),kind:'export',file:name,size:txt.length,verified:true,version:APP_VERSION});await audit('BACKUP_CREATED',name);
  $('#msg').innerHTML='<div class="alert ok">Backup created and verified: '+esc(name)+'. Save it now, then repeat for a second location. A new file name is used each time, so nothing is overwritten.</div>'};
 $('#fl').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const o=await verify(await f.text());
   const counts=Object.entries(o.data).filter(([,v])=>v.length).map(([k,v])=>k+': '+v.length).join(', ')||'empty';
   if(!confirm('Backup from '+new Date(o.created).toLocaleString()+' is valid ('+counts+').\n\nReplace ALL current data with it?'))return;
   for(const n of STORES){if(n==='backups')continue;await req(store(n,'readwrite').clear());for(const r of (o.data[n]||[]))await putOne(n,r)}
   await putOne('backups',{at:new Date().toISOString(),kind:'restore',file:f.name,verified:true});await audit('RESTORE',f.name);
   $('#rmsg').innerHTML='<div class="alert ok">Restore complete.</div>';
  }catch(err){$('#rmsg').innerHTML='<div class="alert bad">'+esc(err.message)+'</div>'}}}
const Q={c:'',p:''};
const CTYPES=['Individual','Hospital','Clinic','Medical institution','Dealer','Other'];
const field=(id,l,v,t='text',x='')=>`<label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}" ${x}>`;
const rowCard=(id,t,s)=>`<div class="card" data-id="${id}" style="margin-top:10px"><b>${esc(t)}</b><br><small style="color:var(--mut)">${esc(s)}</small></div>`;
async function customers(m,id){
 if(id!==undefined)return custForm(m,id);
 m.innerHTML=`<input id="q" placeholder="Search name or mobile" value="${esc(Q.c)}"><button class="btn" id="add">+ New customer</button><div id="lst"></div>`;
 const draw=async()=>{const t=Q.c.toLowerCase();const a=(await getAll('customers')).filter(c=>c.active!==false&&(c.name+c.mobile).toLowerCase().includes(t)).sort((x,y)=>x.name.localeCompare(y.name));
  $('#lst').innerHTML=a.length?a.map(c=>rowCard(c.id,c.name,c.type+' · '+c.mobile+' · '+(c.district||''))).join(''):'<p style="color:var(--mut)">No customers yet.</p>';
  document.querySelectorAll('#lst .card').forEach(e=>e.onclick=()=>customers(m,e.dataset.id))};
 $('#q').oninput=e=>{Q.c=e.target.value;draw()};$('#add').onclick=()=>customers(m,'');draw()}
async function custForm(m,id){
 const c=id?await getOne('customers',id):{};
 m.innerHTML=`<div class="card"><h2>${id?'Edit':'New'} customer</h2>${field('c_name','Name *',c.name||'')}${field('c_mobile','Mobile * (10 digits)',c.mobile||'','tel','inputmode="numeric" maxlength="10"')}${field('c_wa','WhatsApp',c.whatsapp||'','tel','inputmode="numeric" maxlength="10"')}${field('c_addr','Address',c.address||'')}${field('c_dist','District',c.district||'')}${field('c_state','State',c.state||'Kerala')}${field('c_gst','GSTIN (optional)',c.gstin||'')}<label>Customer type</label><select id="c_type">${CTYPES.map(t=>`<option ${c.type===t?'selected':''}>${t}</option>`).join('')}</select>${field('c_notes','Notes',c.notes||'')}<div id="msg"></div><button class="btn" id="sv">Save</button><button class="btn alt" id="bk">Back</button>${id?'<button class="btn alt" id="ar" style="color:var(--bad);border-color:var(--bad)">Archive customer</button><p style="font-size:12px;color:var(--mut)">Sales, rental, payment and service history will appear here once those modules are built.</p>':''}</div>`;
 const bad=t=>$('#msg').innerHTML='<div class="alert bad">'+t+'</div>';
 $('#bk').onclick=()=>customers(m);
 $('#sv').onclick=async()=>{
  const v=k=>$('#c_'+k).value.trim(),g=v('gst').toUpperCase();
  if(!v('name'))return bad('Name is required.');
  if(!/^\d{10}$/.test(v('mobile')))return bad('Mobile must be 10 digits.');
  if(v('wa')&&!/^\d{10}$/.test(v('wa')))return bad('WhatsApp must be 10 digits.');
  if(g&&!/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g))return bad('GSTIN format looks invalid.');
  if((await getAll('customers')).some(x=>x.active!==false&&x.id!==id&&x.mobile===v('mobile')))return bad('Another customer already has this mobile number.');
  const o={...c,id:id||crypto.randomUUID(),name:v('name'),mobile:v('mobile'),whatsapp:v('wa'),address:v('addr'),district:v('dist'),state:v('state'),gstin:g,type:$('#c_type').value,notes:v('notes'),active:true,createdAt:c.createdAt||new Date().toISOString()};
  await putOne('customers',o);await audit(id?'CUSTOMER_UPDATED':'CUSTOMER_CREATED',o.name);customers(m)};
 if(id)$('#ar').onclick=async()=>{if(!confirm('Archive '+c.name+'? Records are kept but hidden from the list.'))return;c.active=false;await putOne('customers',c);await audit('CUSTOMER_ARCHIVED',c.name);customers(m)}}
async function cats(){let c=await getOne('settings','categories');if(!c){c={key:'categories',list:['BiPAP machines','CPAP machines','Oxygen concentrators','Masks','Tubes & accessories','Other']};await putOne('settings',c)}return c}
async function products(m,id){
 if(id!==undefined)return prodForm(m,id);
 const c=await cats();

 m.innerHTML=`<div class="card"><h2>Find serial number</h2>${field('q_s','Serial number (part is fine)','')}<div id="res"></div></div><div class="card"><h2>Add serials for stock you already hold</h2><p style="font-size:13px;color:var(--mut);margin-top:0">For items bought before serial tracking. This does not change the stock quantity.</p>${T.length?`<select id="a_p">${T.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><label>Serial numbers (one per line)</label><textarea id="a_t" rows="4"></textarea><div id="amsg"></div><button class="btn" id="a_s">Add serials</button>`:'<p style="font-size:14px">Turn on Track serial numbers for a saleable product first.</p>'}</div>`;
 const show=()=>{const q=$('#q_s').value.trim().toLowerCase();if(!q){$('#res').innerHTML='';return}const rows=[];
  us.filter(u=>u.serial.toLowerCase().includes(q)&&u.status!=='void').forEach(u=>{const s=inv.find(i=>i.id===u.saleId),p=pu.find(x=>x.id===u.purchaseId);rows.push(`<div class="card"><b>${esc(u.serial)}</b> \u00b7 ${esc(pn[u.productId])}<br><small>${u.status==='instock'?'In stock':u.status==='sold'?'Sold to '+esc(cn[u.customerId])+' on '+esc(u.soldAt||'')+' ('+esc(s&&s.number)+')':esc(u.status)}${p?' \u00b7 bought on '+esc(p.number):''}</small>${u.status==='instock'?`<button class="btn alt" data-w="${u.id}" style="margin-top:8px">Write off (damaged or lost)</button>`:''}</div>`)});
  ms.filter(x=>x.serial.toLowerCase().includes(q)&&x.active!==false).forEach(x=>{const h=rs.filter(r=>r.machineId===x.id).map(r=>esc(r.number)+' '+esc(cn[r.customerId])+' ('+r.status+')').join('; ');rows.push(`<div class="card"><b>${esc(x.serial)}</b> \u00b7 ${esc(pn[x.productId])} (rental machine)<br><small>${MS[x.status]}${h?' \u00b7 Rentals: '+h:''}</small></div>`)});
  sv.filter(s=>(s.serialText||'').toLowerCase().includes(q)).forEach(s=>rows.push(`<div class="card"><small>Service ${esc(s.number)} for ${esc(cn[s.customerId])}: ${esc(s.complaint)} (${SS[s.status]})</small></div>`));
  $('#res').innerHTML=rows.join('')||'<p>No match.</p>';
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=async()=>{const u=us.find(x=>x.id===b.dataset.w);if(!confirm('Write off '+u.serial+'? Stock goes down by 1.'))return;await atomic([['units',{...u,status:'writtenoff'}],['stock',{id:crypto.randomUUID(),productId:u.productId,date:tdy(),at:new Date().toISOString(),qty:-1,type:'damaged',ref:u.serial,note:'Written off'}]]);await audit('SERIAL_WRITTEN_OFF',u.serial);serialView(m)})};
 $('#q_s').oninput=show;
 if($('#a_s'))$('#a_s').onclick=async()=>{const bad=t=>$('#amsg').innerHTML='<div class="alert bad">'+t+'</div>',a=$('#a_t').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean),pid=$('#a_p').value;
  if(!a.length)return bad('Enter at least one serial number.');
  const lv=(await stockLevels()).find(x=>x.p.id===pid),have=us.filter(u=>u.productId===pid&&u.status==='instock').length;
  if(lv&&have+a.length>lv.q)return bad('Stock is '+lv.q+' and '+have+' serial(s) are already recorded, so you can add at most '+(lv.q-have)+'.');
  const taken=new Set([...us.filter(u=>u.status!=='void').map(u=>u.serial.toLowerCase()),...ms.filter(x=>x.active!==false).map(x=>x.serial.toLowerCase())]),seen=new Set();
  for(const s of a){const k=s.toLowerCase();if(taken.has(k)||seen.has(k))return bad('Serial '+esc(s)+' already exists.');seen.add(k)}
  await atomic(a.map(s=>['units',{id:crypto.randomUUID(),serial:s,productId:pid,status:'instock',purchaseId:null,createdAt:new Date().toISOString()}]));await audit('SERIALS_ADDED',a.length+' for '+pn[pid]);serialView(m)}}
async function rnDoc(m,id){
 const [s,co,cs,ms]=await Promise.all([getOne('services',id),getOne('settings','company'),getAll('customers'),getAll('machines')]),cu=cs.find(c=>c.id===s.customerId)||{},mc=ms.find(x=>x.id===s.machineId)||{};
 if(!s.rn){s.rn=await nextNo('receipt_note');s.rnDate=s.date;await putOne('services',s)}
 m.innerHTML=`<div class="card"><div style="text-align:center"><b style="font-size:18px">${esc(co.name)}</b><br>${esc(co.address)}<br>${esc(co.phone)}</div><h2 style="text-align:center;margin-top:12px">MACHINE RECEIPT NOTE</h2><p style="font-size:14px"><b>${esc(s.rn)}</b> \u00b7 ${s.rnDate}<br>Service order: ${esc(s.number)}<br>Received from: <b>${esc(cu.name)}</b><br>${esc(cu.address)} ${esc(cu.district)}<br>Phone: ${esc(cu.mobile)}</p><div class="scroll"><table><tr><th>Machine</th><th>Serial no.</th><th>Warranty</th></tr><tr><td>${esc(s.model||'')}</td><td><b>${esc(s.serialText||mc.serial||'')}</b></td><td>${esc(s.warranty||'unknown')}</td></tr></table></div><p style="font-size:14px">Complaint: ${esc(s.complaint)}<br>Accessories received: ${esc(s.accessories||'None')}<br>Condition on receipt: ${esc(s.conditionIn||'-')}</p><p style="font-size:13px">Machine received for inspection and repair as described above.</p><table style="margin-top:22px"><tr><td style="border:0">Received by<br><br>________________</td><td style="border:0;text-align:right">Customer signature<br><br>________________</td></tr></table><div class="noprint"><button class="btn" id="pr">Print / Save as PDF</button><button class="btn alt" id="bk">Back</button></div></div>`;
 $('#pr').onclick=()=>{try{window.print()}catch(e){}};$('#bk').onclick=()=>svcDoc(m,id)}
async function wdnDoc(m,id){
 const [s,co,cs,us,inv]=await Promise.all([getOne('services',id),getOne('settings','company'),getAll('customers'),getAll('units'),getAll('invoices')]),cu=cs.find(c=>c.id===s.customerId)||{},u=us.find(x=>x.status==='sold'&&x.serial===s.serialText),i=u&&inv.find(x=>x.id===u.saleId),c=s.company;
 m.innerHTML=`<div class="card"><div style="text-align:center"><b style="font-size:18px">${esc(co.name)}</b><br>${esc(co.address)}<br>${co.gstin?'GSTIN: '+esc(co.gstin):''} ${esc(co.phone)}</div><h2 style="text-align:center;margin-top:12px">DELIVERY NOTE</h2><p style="text-align:center;margin:0;font-size:13px">Machine sent for warranty repair or replacement</p><p style="font-size:14px"><b>${esc(c.dn)}</b> \u00b7 ${c.sentDate}<br>To: <b>${esc(c.name)}</b>${c.ref?'<br>Your reference: '+esc(c.ref):''}<br>Our service order: ${esc(s.number)} (receipt note ${esc(s.rn||'-')})</p><div class="scroll"><table><tr><th>Machine</th><th>Serial no.</th><th>Warranty</th></tr><tr><td>${esc(s.model||'')}</td><td><b>${esc(s.serialText||'')}</b></td><td>${esc(s.warranty||'unknown')}</td></tr></table></div><p style="font-size:14px">Complaint: ${esc(s.complaint)}<br>Accessories sent: ${esc(s.accessories||'None')}<br>End customer: ${esc(cu.name)}${i?'<br>Sold by us on '+esc(u.soldAt)+', invoice '+esc(i.number):''}${c.notes?'<br>Notes: '+esc(c.notes):''}</p><table style="margin-top:22px"><tr><td style="border:0">Sent by<br><br>________________</td><td style="border:0;text-align:right">Received by (name, signature, date)<br><br>________________</td></tr></table><div class="noprint"><button class="btn" id="pr">Print / Save as PDF</button><button class="btn alt" id="bk">Back</button></div></div>`;
 $('#pr').onclick=()=>{try{window.print()}catch(e){}};$('#bk').onclick=()=>svcDoc(m,id)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
boot();
</script></body></html>
